name = "ai-quiz-game"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# GEMINI_API_KEY is a secret — set it in the Cloudflare dashboard
# (Settings → Variables and Secrets) or with:
#   npx wrangler pages secret put GEMINI_API_KEY --project-name ai-quiz-game
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Optional abuse protection. Without this the game still works, but anyone
# with the URL can spend your Gemini quota. To enable it:
#   1. npx wrangler kv namespace create RATE_LIMIT
#   2. Bind it in the dashboard (Settings → Functions → KV namespace bindings)
#      with the variable name RATE_LIMIT — or uncomment the block below:
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<paste-the-namespace-id>"
